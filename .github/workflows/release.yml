name: Release theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and package
        run: npm run package
      - name: Verify tag version
        run: |
          VERSION="$(node -p "require('./komari-theme.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/komari-butterfly-v*.zip release/komari-butterfly-v*.zip.sha256 --title "Komari Butterfly $GITHUB_REF_NAME" --generate-notes --verify-tag
